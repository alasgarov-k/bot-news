<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>RiskBot xəbərlər</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1 id="title">RiskBot</h1>
  <div class="upd" id="updated"></div>
</header>
<nav>
  <button data-tab="today" class="on">Bu gün</button>
  <button data-tab="search">Axtarış</button>
  <button data-tab="watch">İzlə<span id="badge"></span></button>
</nav>
<main>
  <section id="today"></section>
  <section id="search" class="hidden">
    <div class="row"><input id="q" type="search" placeholder="Söz yazın: Filanbank, sanksiyalar, CVE…"
                            autocomplete="off"></div>
    <div id="results"></div>
  </section>
  <section id="watch" class="hidden"></section>
</main>
<script src="app.js"></script>
</body>
</html>
